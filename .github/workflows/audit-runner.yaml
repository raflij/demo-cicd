name: Cek Spesifikasi Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-specs:
    name: Inspect System Specifications
    runs-on: self-hosted # Ganti ke 'self-hosted' jika mengecek server pribadi/VPS
    timeout-minutes: 5

    steps:
      - name: Check OS & Kernel
        run: |
          echo "=== OS RELEASE ==="
          cat /etc/os-release | grep -E "^(PRETTY_NAME|VERSION)="
          echo ""
          echo "=== KERNEL & ARCHITECTURE ==="
          uname -srm

      - name: Check CPU Specs
        run: |
          echo "=== CPU DETAILS ==="
          lscpu | grep -E "^(Architecture|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Model name):"

      - name: Check Memory (RAM & Swap)
        run: |
          echo "=== MEMORY USAGE ==="
          free -h

      - name: Check Disk Storage
        run: |
          echo "=== DISK SPACE ==="
          df -hT -x tmpfs -x devtmpfs -x squashfs

      - name: Generate Job Summary
        if: always()
        run: |
          {
            echo "### 🖥️ Server Specifications Summary"
            echo ""
            echo "| Component | Specification |"
            echo "| :--- | :--- |"
            echo "| **OS** | $(grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2 | tr -d '\"') |"
            echo "| **Kernel** | $(uname -r) ($(uname -m)) |"
            echo "| **CPU Model** | $(lscpu | grep 'Model name:' | cut -d: -f2 | xargs) |"
            echo "| **vCPU Cores** | $(nproc) Cores |"
            echo "| **Total RAM** | $(free -h | awk '/^Mem:/ {print $2}') |"
            echo "| **Root Disk (Avail/Total)** | $(df -h / | awk 'NR==2 {print $4 " free of " $2}') |"
          } >> "$GITHUB_STEP_SUMMARY"
