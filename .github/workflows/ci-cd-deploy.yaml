name: CI/CD — Deploy to Self-Hosted

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: demo-todo-app
  HOST_PORT: "8080" # published port on the server host

jobs:
  build:
    name: Install & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm ci

      - name: Build (acts as the test gate)
        run: npm run build

      - name: Tag the deployable version
        id: version
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          retention-days: 5

  deploy:
    name: Deploy as Docker container
    needs: build
    runs-on: self-hosted # runner has Docker and IS the target host
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify Docker on the runner
        run: docker --version

      - name: Build versioned image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }} ${{ env.IMAGE_NAME }}:latest

      - name: Stop & remove previous container (if any)
        run: |
          docker rm -f ${{ env.IMAGE_NAME }} 2>/dev/null || true

      - name: Run new container on the host port
        run: |
          docker run -d \
            --name ${{ env.IMAGE_NAME }} \
            --restart unless-stopped \
            -p ${{ env.HOST_PORT }}:4173 \
            ${{ env.IMAGE_NAME }}:latest
          echo "Container started. Reach it at http://<server-ip>:${{ env.HOST_PORT }}"

      - name: Health check via published port
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:${{ env.HOST_PORT }}" >/dev/null; then
              echo "Deploy ${{ needs.build.outputs.version }} live on port ${{ env.HOST_PORT }}."
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 50 ${{ env.IMAGE_NAME }} || true
          echo "Container did not respond on port ${{ env.HOST_PORT }}." >&2
          exit 1

      - name: Prune old dangling images
        run: docker image prune -f >/dev/null 2>&1 || true
