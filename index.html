<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
  </head>
  <body class="bg-slate-100 min-h-screen font-sans">
    <main class="mx-auto max-w-lg px-4 py-12">
      <h1 class="mb-6 text-3xl font-bold tracking-tight text-slate-900">To-do</h1>
      <form id="todo-form" class="mb-6 flex gap-2">
        <input
          id="todo-input"
          type="text"
          name="todo"
          placeholder="Add a new task…"
          autocomplete="off"
          required
          class="w-full flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-800 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
        />
        <button
          type="submit"
          class="rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white shadow-sm transition-colors hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500/40"
        >
          Add
        </button>
      </form>
      <div id="empty-state" class="hidden rounded-lg border-2 border-dashed border-slate-300 py-10 text-center text-slate-500">
        No tasks yet. Add one above to get started.
      </div>
      <ul id="todo-list" class="flex flex-col gap-2"></ul>
      <footer class="mt-6 flex items-center justify-between text-sm text-slate-500">
        <span id="todo-counter"></span>
        <button
          id="clear-completed"
          type="button"
          class="hidden font-medium text-slate-500 hover:text-rose-600 focus:outline-none"
        >
          Clear completed
        </button>
      </footer>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
