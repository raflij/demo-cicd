<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
  </head>
  <body class="bg-slate-100 min-h-screen font-sans">
    <main class="mx-auto max-w-lg px-4 py-12">
      <div id="load-error-banner" class="hidden mb-4 flex items-start justify-between gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
        <span>Couldn't load your saved tasks — starting fresh.</span>
        <button id="dismiss-load-error" type="button" class="shrink-0 rounded px-1 text-amber-700 hover:bg-amber-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500" aria-label="Dismiss">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <h1 class="mb-1 text-3xl font-bold tracking-tight text-slate-900">To-do</h1>
      <p id="save-status" class="mb-4 text-xs text-slate-500 opacity-0 transition-opacity duration-300" aria-live="polite" aria-atomic="true">Saved</p>
      <form id="todo-form" class="mb-6 flex gap-2">
        <input
          id="todo-input"
          type="text"
          name="todo"
          placeholder="Add a new task…"
          autocomplete="off"
          required
          class="w-full flex-1 rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-800 placeholder-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
        />
        <button
          type="submit"
          class="rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white shadow-sm transition-colors hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/40"
        >
          Add
        </button>
      </form>
      <div id="empty-state" class="hidden rounded-lg border-2 border-dashed border-slate-300 py-10 text-center text-slate-500">
        No tasks yet. Add one above to get started.
      </div>
      <ul id="todo-list" class="flex flex-col gap-2" aria-label="Task list"></ul>
      <footer class="mt-6 flex items-center justify-between text-sm text-slate-600">
        <span id="todo-counter" aria-live="polite"></span>
        <button
          id="clear-completed"
          type="button"
          class="hidden font-medium text-slate-600 hover:text-rose-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-500"
        >
          Clear completed
        </button>
      </footer>
    </main>

    <div id="undo-toast" class="hidden fixed bottom-6 left-1/2 z-50 flex -translate-x-1/2 items-center gap-3 rounded-lg bg-slate-900 px-4 py-3 text-sm text-white shadow-lg">
      <span id="undo-message" class="text-slate-100"></span>
      <button id="undo-action" type="button" class="shrink-0 rounded-md bg-indigo-500 px-2.5 py-1 font-medium text-white hover:bg-indigo-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400">
        Undo
      </button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
